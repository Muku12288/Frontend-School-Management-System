

<div class="bg" style="margin-top: 300px;">
    <mat-spinner *ngIf="isSpinning" [diameter]="50" class="spinner"></mat-spinner>
    <div class="parent">
        <div class="child">
            <h1 class="form-title">Update Teacher</h1>
            <form class="login-form" [formGroup]="validateForm">

                <!--Name Input -->
                <mat-form-field appearance="outline" class="form-field">
                    <mat-label>Name</mat-label>
                    <input matInput type="text" placeholder="Enter Name" formControlName="name"/>
                    <mat-error *ngIf="validateForm.get('name')?.hasError('required')">This 
                        Input is Required!</mat-error>
                </mat-form-field>

                <!--Qualification Input -->
                <mat-form-field appearance="outline" class="form-field">
                    <mat-label>Qualification</mat-label>
                    <input matInput type="text" placeholder="Qualification" formControlName="qualification"/>
                    <mat-error *ngIf="validateForm.get('qualification')?.hasError('required')">This 
                        Input is Required!</mat-error>
                </mat-form-field>

                <!--Depertment Input -->
                <mat-form-field appearance="outline" class="form-field">
                    <mat-label>Department</mat-label>
                    <mat-select formControlName="department" placeholder="Select Department" formControlName="department">
                        <mat-option *ngFor="let department of DEPARTMENT" [value]="department">{{department }}</mat-option>
                    </mat-select>
                    <mat-error *ngIf="validateForm.get('department')?.hasError('required')">This 
                        Input is Required!</mat-error>
                </mat-form-field>
                <!--Date of Birth Input -->
                <mat-form-field appearance="outline" class="form-field">
                    <mat-label>Date of Birth</mat-label>
                    <input matInput [matDatepicker]="picker" placeholder="Choose a date" formControlName="dob"/>
                    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-datepicker #picker></mat-datepicker>
                    <mat-error *ngIf="validateForm.get('dob')?.hasError('required')">This 
                        Input is Required!</mat-error>
                </mat-form-field>

                <!--Address Input -->
                <mat-form-field appearance="outline" class="form-field">
                    <mat-label>Address</mat-label>
                    <textarea  matInput placeholder="Address" formControlName="address"></textarea>
                    <mat-error *ngIf="validateForm.get('address')?.hasError('required')">This 
                        Input is Required!</mat-error>
                </mat-form-field>

                <!--gender Input -->
                <mat-form-field appearance="outline" class="form-field">
                    <mat-label>Gender</mat-label>
                    <mat-select formControlName="gender" placeholder="Select a gender" formControlName="gender">
                        <mat-option *ngFor="let gender of GENDER" [value]="gender">{{gender }}</mat-option>
                    </mat-select>
                    <mat-error *ngIf="validateForm.get('gender')?.hasError('required')">This 
                        Input is Required!</mat-error>
                </mat-form-field>

                <button mat-raised-button color="primary" [disabled]="validateForm.invalid" (click)="updateTeacher()">Update</button>

            </form>
        </div>
    </div>
</div>
