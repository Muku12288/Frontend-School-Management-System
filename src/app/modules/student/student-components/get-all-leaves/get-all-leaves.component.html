<div class="card-container" fxLayout="row" fxLayout.xs="column" fxLayoutGap="16px">
    <mat-card class="student-card" *ngFor="let leave of leaves">
        <mat-card-content style="margin-top: 10px;">
            <p>Subject : <strong>{{ leave.subject}}</strong></p>
            <p>Body : <strong>{{ leave.body}}</strong></p>
            <p>Date: <strong>{{ leave.date | date: 'ddMMM y'}}</strong></p>
            <p>Status: <strong
                [ngStyle]="{'color': leave.studentLeaveStatus === 'Approved' ? 'green' : leave.studentLeaveStatus === 'Disapproved' ?
                 'red' : 'orange'}">{{leave.studentLeaveStatus}}</strong></p>
        </mat-card-content>
    </mat-card>
</div>
